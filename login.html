<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{display:flex;justify-content:center;align-items:center;height:100vh;background:#f4f4f4;}
.login-box{background:white;padding:40px;width:350px;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,0.1);}
.login-box h2{text-align:center;margin-bottom:25px;}
.input-group{margin-bottom:15px;}
.input-group input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px;}
button{width:100%;padding:12px;border:none;border-radius:8px;background:#0078ff;color:white;font-size:16px;cursor:pointer;}
.signup{text-align:center;margin-top:15px;}
.signup a{color:#0078ff;text-decoration:none;}
</style>
</head>
<body>
<div class="login-box">
<h2>Login</h2>
<form>
<div class="input-group"><input type="email" placeholder="Email" required></div>
<div class="input-group"><input type="password" placeholder="Password" required></div>
<button type="submit">Login</button>
<div class="signup">Don't have an account? <a href="#">Sign Up</a></div>
</form>
</div>
</body>
</html>
